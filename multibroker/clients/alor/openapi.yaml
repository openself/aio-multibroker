security:
  - bearerAuth: []
tags:
  - name: Authorization
    description: |
      В этой категории представлены запросы, позволяющие получать [авторизационные токены](https://alor.dev/docs/api/access/authorization/access-token/) для подтверждения прав доступа к другим ресурсам системы.

      Выполнение запросов данной категории рекомендуется автоматизировать в первую очередь, так как результаты их выполнения потребуются для всех остальных операций.
    x-displayName: Авторизация
  - name: ClientInfo
    description: |
      В этой категории представлены запросы, позволяющие получить информацию о клиенте: портфели, позиции, риски и так далее.

      Основная задача этих запросов — контроль состояния торгового аккаунта и его активов при ведении торгов.
    x-displayName: О клиенте
  - name: Instruments
    description: |
      В этой категории представлены запросы, позволяющие получить информацию о финансовых инструментах: полный список инструментов на бирже, их котировки и биржевые стаканы, история заключённых сделок и так далее.

      Основная задача этих запросов — предоставление биржевых данных, которые будут использоваться при планировании торговой стратегии и непосредственном проведении торгов.
    x-displayName: Об инструменте
  - name: Orders
    description: |
      В этой категории представлены запросы, позволяющие управлять рыночными и лимитными заявками. 
      
      Запросы на управление условными заявками находятся в категории [Стоп-заявки v2](https://alor.dev/docs/api/http/stop-orders-v-2)
    x-displayName: Биржевые заявки
  - name: StopOrdersV2
    description: |
      В этой категории представлены запросы, позволяющие управлять условными заявками (стоп-, стоп-лимит). 
      
      Запросы на управление рыночными и лимитными заявками находятся в категории [Биржевые заявки](https://alor.dev/docs/api/http/orders)
    x-displayName: Условные заявки
  - name: OrderGroups
    description: |
      В этой категории представлены запросы, позволяющие управлять группами заявок.

      Обратите внимание, что группы заявок создаются на основе заранее выставленных [биржевых](https://alor.dev/docs/api/http/orders) и [условных](https://alor.dev/docs/api/http/stop-orders-v-2) заявок.
    x-displayName: Группы заявок
  - name: Other
    description: |
      В этой категории представлены запросы, не подпадающие ни под одну из прочих представленных категорий.
    x-displayName: Другое
  - name: Deprecated
    description: |
      В этой категории представлены запросы, утратившие свою актуальность.

      Описание запросов, входящих в эту категорию, может содержать неточности и параметры, выведенные из эксплуатации.

      Не рекомендуется использовать запросы из этой категории, так как в ответ на них система может возвращать некорректные данные или не возвращать ничего вовсе.

      Рекомендуем обратить внимание на другие категории и подобрать подходящие запросы из списка актуальных.
    x-displayName: Устаревшее
paths:
  /refresh:
    post:
      summary: JWT token
      tags:
        - Authorization
      servers:
        - url: https://oauthdev.alor.ru
          description: Тестовый контур
        - url: https://oauth.alor.ru
          description: Боевой контур
      description: |
        Запрос на создание JWT токена, использующегося в качестве токена доступа при авторизации запросов к остальным ресурсам API.

        Для создания JWT токена используется создаваемый в кабинете разработчика Refresh токен. При этом:
        * Передать его серверу можно как в пути (как `Query`), так и в теле запроса (как `Body`);
        * При одновременном заполнении `Query` и `Body` приоритет отдаётся телу запроса;
        * Комбинировать `Query` и `Body` в одном запросе нельзя

        Подробнее об особенностях авторизации можно прочесть в [соответствующем разделе](https://alor.dev/docs/api/access/authorization/overview/).

        В описании запроса по умолчанию используется адрес тестового контура системы. Это сделано для защиты пользователей от случайного выполнения операций с настоящими данными. Учитывайте это при выполнении запросов и копировании образцов кода.

        Сменить контур на странице описания запроса можно в окне **Request**. Узнать подробнее о контурах можно в [соответствующей статье](https://alor.dev/docs/api/access/environments).

      requestBody:
        $ref: '#/components/requestBodies/RefreshAccessToken'
      parameters:
        - $ref: '#/components/parameters/query_Token_Optional'
        - $ref: '#/components/parameters/query_AllowedPortfolios_Optional'
      responses:
        '200':
          description: 'Запрос успешно обработан'
          content:
            application/json:
              schema:
                type: string
                description: |
                  JWT сгенерирован
              examples:
                Пример JWT:
                  value:
                    AccessToken: eyJhbGciOiJ...
        '403':
          description: Не удалось сгенерировать JWT. Refresh token задан некорректно или его срок действия истёк
      security: []
  ## MARKET DATA --------------------------------------------------------
  /md/v2/Clients/{exchange}/{portfolio}/orders:
    get:
      tags:
        - ClientInfo
        - Orders
      summary: 'Все биржевые заявки'
      description: |
        Запрос возвращает информацию обо всех заявках для указанного `portfolio`, созданных на заданной в параметре `exchange` бирже.

        Запрос нельзя выполнить анонимно. Обязательный параметр `token` должен содержать актуальный [**Access токен**](https://alor.dev/docs/api/access/authorization/access-token/).

        В описании запроса по умолчанию используется адрес тестового контура системы. Это сделано для защиты пользователей от случайного выполнения операций с настоящими данными. Учитывайте это при выполнении запросов и копировании образцов кода.

        Сменить контур на странице описания запроса можно в окне **Request**. Узнать подробнее о контурах можно в [соответствующей статье](https://alor.dev/docs/api/access/environments).

        Для этой операции есть альтернатива в виде [WebSocket-подписки](https://alor.dev/docs/api/websocket/data-subscriptions/OrdersGetAndSubscribe).

      operationId: MdV2ClientsExchangePortfolioOrdersGet
      parameters:
        - $ref: '#/components/parameters/path_Exchange_All'
        - $ref: '#/components/parameters/path_Portfolio_FOND'
        - $ref: '#/components/parameters/query_Format_Optional'
        - $ref: '#/components/parameters/query_JsonResponse_Optional'
      responses:
        '200':
          $ref: '#/components/responses/200_Orders'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      deprecated: false
