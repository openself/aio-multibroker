        - $ref: '#/components/parameters/path_Portfolio_FOND'
        - $ref: '#/components/parameters/query_WithRepo_Optional'
        - $ref: '#/components/parameters/query_Format_Optional'
        - $ref: '#/components/parameters/query_JsonResponse_Optional'
      responses:
